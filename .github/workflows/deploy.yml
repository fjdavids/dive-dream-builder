name: Build & Deploy to Hostinger (Vite)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure npm (legacy peer deps)
        run: npm config set legacy-peer-deps true

      - name: Install deps
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Create deployment marker
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > dist/deploy-version.txt
          printf '<!doctype html><html><body>%s</body></html>\n' \
            "${GITHUB_SHA}" > dist/deploy-version.html
          test -s dist/deploy-version.txt
          test -s dist/deploy-version.html
          echo "Local deployment markers:"
          ls -la dist/deploy-version.*
          echo "TXT:"
          cat dist/deploy-version.txt

      - name: Verify dist output
        run: |
          set -euo pipefail
          test -s dist/index.html || { echo "::error::dist/index.html missing/empty."; exit 1; }
          test -s dist/deploy-version.txt || { echo "::error::dist/deploy-version.txt missing/empty."; exit 1; }
          test -s dist/deploy-version.html || { echo "::error::dist/deploy-version.html missing/empty."; exit 1; }
          test -s dist/sitemap.xml || { echo "::error::dist/sitemap.xml missing/empty."; exit 1; }
          test -s dist/robots.txt || { echo "::error::dist/robots.txt missing/empty."; exit 1; }
          test -s dist/.htaccess || { echo "::error::dist/.htaccess missing (redirects + SPA fallback)."; exit 1; }
          grep -qi "<h1" dist/index.html || { echo "::error::dist/index.html has no H1 (prerender failed)."; exit 1; }
          grep -qi "<h2" dist/index.html || { echo "::error::dist/index.html has no H2 (prerender failed)."; exit 1; }
          grep -q 'rel="canonical" href="https://divelife.mx/"' dist/index.html || { echo "::error::dist/index.html missing canonical."; exit 1; }
          echo "dist/index.html size: $(wc -c < dist/index.html) bytes"
          echo "Files in dist/:"
          find dist -maxdepth 2 -type f -print | sort



      - name: Install FTP client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      - name: Validate Hostinger FTP configuration
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_PORT FTP_PROTOCOL FTP_SERVER_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret ${name} is missing or empty."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          if [[ "$FTP_HOST" =~ ^[a-zA-Z]+:// ]] || [[ "$FTP_HOST" == */* ]]; then
            echo "::error::FTP_HOST must contain only the hostname or IP address, with no protocol and no path."
            exit 1
          fi
          if [[ "$FTP_HOST" =~ [[:space:]] ]]; then
            echo "::error::FTP_HOST contains whitespace. Check for accidental spaces or newlines in the secret."
            exit 1
          fi
          for name in FTP_USERNAME FTP_PASSWORD; do
            value="${!name}"
            if [[ "$value" == *$'\n'* ]] || [[ "$value" == *$'\r'* ]]; then
              echo "::error::${name} contains a newline. Re-save the GitHub secret without line breaks."
              exit 1
            fi
          done

          protocol="$FTP_PROTOCOL"
          case "$protocol" in
            ftp|ftps|ftps-legacy) ;;
            *) echo "::error::FTP_PROTOCOL must be one of: ftp, ftps, ftps-legacy."; exit 1 ;;
          esac
          if [ "$protocol" != "ftp" ]; then
            echo "::error::FTP_PROTOCOL must be ftp for the current Hostinger production deployment."
            exit 1
          fi

          port="$FTP_PORT"
          if ! [[ "$port" =~ ^[0-9]+$ ]] || [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
            echo "::error::FTP_PORT must be a valid TCP port number."
            exit 1
          fi
          if [ "$port" != "21" ]; then
            echo "::error::FTP_PORT must be 21 for the current Hostinger production deployment."
            exit 1
          fi

          server_dir="$FTP_SERVER_DIR"
          if [[ "$server_dir" =~ ^[a-zA-Z]+:// ]]; then
            echo "::error::FTP_SERVER_DIR must be a remote path only, not a URL."
            exit 1
          fi
          if [ "$server_dir" != "/" ]; then
            echo "::error::FTP_SERVER_DIR must be / because the Hostinger FTP account is already chrooted to the public web root."
            exit 1
          fi


          {
            echo "FTP_PROTOCOL_EFFECTIVE=$protocol"
            echo "FTP_PORT_EFFECTIVE=$port"
            echo "FTP_SERVER_DIR_EFFECTIVE=$server_dir"
          } >> "$GITHUB_ENV"
          echo "Hostinger FTP configuration validated without printing credentials."

      - name: Test Hostinger FTP connection (no upload)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          ssl_settings="set ftp:ssl-allow no"
          scheme="ftp"
          if [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps" ]; then
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          elif [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps-legacy" ]; then
            scheme="ftps"
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          fi

          lftp <<LFTP
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set ftp:passive-mode yes
          ${ssl_settings}
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT_EFFECTIVE}" "${scheme}://${FTP_HOST}"
          pwd
          cls -la "${FTP_SERVER_DIR_EFFECTIVE}"
          bye

          LFTP

      - name: Deploy dist to Hostinger via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          ssl_settings="set ftp:ssl-allow no"
          scheme="ftp"
          if [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps" ]; then
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          elif [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps-legacy" ]; then
            scheme="ftps"
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          fi

          lftp <<LFTP
          set cmd:fail-exit yes
          set net:timeout 120
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set ftp:passive-mode yes
          set xfer:clobber yes
          ${ssl_settings}
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT_EFFECTIVE}" "${scheme}://${FTP_HOST}"
          mirror --reverse --verbose=1 --parallel=1 --only-newer --no-perms "dist/" "${FTP_SERVER_DIR_EFFECTIVE}"
          bye
          LFTP

      - name: Verify marker on Hostinger FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
      - name: Inspect Hostinger FTP after deploy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          ssl_settings="set ftp:ssl-allow no"
          scheme="ftp"
          if [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps" ]; then
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          elif [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps-legacy" ]; then
            scheme="ftps"
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          fi

          lftp <<LFTP
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 2
          set ftp:passive-mode yes
          ${ssl_settings}
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT_EFFECTIVE}" "${scheme}://${FTP_HOST}"
          echo "REMOTE CURRENT DIRECTORY"
          pwd
          echo "REMOTE ROOT LISTING"
          cls -la /
          echo "REMOTE INDEX"
          cls -l /index.html
          echo "REMOTE TXT MARKER"
          cls -l /deploy-version.txt
          cat /deploy-version.txt
          echo "REMOTE HTML MARKER"
          cls -l /deploy-version.html
          cat /deploy-version.html
          bye
          LFTP

      - name: Verify public deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          check_url() {
            url="$1"
            for attempt in 1 2 3 4 5 6; do
              echo "Attempt $attempt: $url"
              status="$(curl \
                --silent \
                --show-error \
                --location \
                --output /tmp/deploy-response \
                --write-out '%{http_code}' \
                --connect-timeout 15 \
                --max-time 60 \
                "${url}?commit=${EXPECTED_SHA}&attempt=${attempt}" || true)"
              echo "HTTP status: $status"
              echo "Response:"
              cat /tmp/deploy-response || true
              echo

              if [ "$status" = "200" ] && grep -Fq "$EXPECTED_SHA" /tmp/deploy-response; then
                return 0
              fi
              sleep 10
            done
            return 1
          }

          if check_url "https://divelife.mx/deploy-version.txt"; then
            echo "TXT marker verified."
          elif check_url "https://divelife.mx/deploy-version.html"; then
            echo "HTML marker verified."
          else
            echo "::error::Files exist by FTP but neither marker is publicly accessible."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 60 \
            "https://divelife.mx/?commit=${EXPECTED_SHA}" \
            > /tmp/production-index.html
          test -s /tmp/production-index.html
          echo "Production deployment verified: $EXPECTED_SHA"


