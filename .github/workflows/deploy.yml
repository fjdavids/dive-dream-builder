name: Build & Deploy to Hostinger (Vite)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure npm (legacy peer deps)
        run: npm config set legacy-peer-deps true

      - name: Install deps
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Verify dist output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html was not generated. Aborting deploy."; exit 1; }
          test -s dist/index.html || { echo "::error::dist/index.html is empty. Aborting deploy."; exit 1; }
          printf '%s\n' "${GITHUB_SHA}" > dist/deploy-version.txt
          ls -la dist

      - name: Install FTP client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      - name: Validate Hostinger FTP configuration
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_PORT FTP_PROTOCOL FTP_SERVER_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret ${name} is missing or empty."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          if [[ "$FTP_HOST" =~ ^[a-zA-Z]+:// ]] || [[ "$FTP_HOST" == */* ]]; then
            echo "::error::FTP_HOST must contain only the hostname or IP address, with no protocol and no path."
            exit 1
          fi
          if [[ "$FTP_HOST" =~ [[:space:]] ]]; then
            echo "::error::FTP_HOST contains whitespace. Check for accidental spaces or newlines in the secret."
            exit 1
          fi
          for name in FTP_USERNAME FTP_PASSWORD; do
            value="${!name}"
            if [[ "$value" == *$'\n'* ]] || [[ "$value" == *$'\r'* ]]; then
              echo "::error::${name} contains a newline. Re-save the GitHub secret without line breaks."
              exit 1
            fi
          done

          protocol="$FTP_PROTOCOL"
          case "$protocol" in
            ftp|ftps|ftps-legacy) ;;
            *) echo "::error::FTP_PROTOCOL must be one of: ftp, ftps, ftps-legacy."; exit 1 ;;
          esac
          if [ "$protocol" != "ftp" ]; then
            echo "::error::FTP_PROTOCOL must be ftp for the current Hostinger production deployment."
            exit 1
          fi

          port="$FTP_PORT"
          if ! [[ "$port" =~ ^[0-9]+$ ]] || [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
            echo "::error::FTP_PORT must be a valid TCP port number."
            exit 1
          fi
          if [ "$port" != "21" ]; then
            echo "::error::FTP_PORT must be 21 for the current Hostinger production deployment."
            exit 1
          fi

          server_dir="$FTP_SERVER_DIR"
          if [[ "$server_dir" =~ ^[a-zA-Z]+:// ]]; then
            echo "::error::FTP_SERVER_DIR must be a remote path only, not a URL."
            exit 1
          fi
          if [ "$server_dir" != "/" ]; then
            echo "::error::FTP_SERVER_DIR must be / because the Hostinger FTP account is already chrooted to the public web root."
            exit 1
          fi


          {
            echo "FTP_PROTOCOL_EFFECTIVE=$protocol"
            echo "FTP_PORT_EFFECTIVE=$port"
            echo "FTP_SERVER_DIR_EFFECTIVE=$server_dir"
          } >> "$GITHUB_ENV"
          echo "Hostinger FTP configuration validated without printing credentials."

      - name: Test Hostinger FTP connection (no upload)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          ssl_settings="set ftp:ssl-allow no"
          scheme="ftp"
          if [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps" ]; then
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          elif [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps-legacy" ]; then
            scheme="ftps"
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          fi

          lftp <<LFTP
          set cmd:fail-exit yes
          set net:timeout 60
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set ftp:passive-mode yes
          ${ssl_settings}
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT_EFFECTIVE}" "${scheme}://${FTP_HOST}"
          pwd
          cls -la "${FTP_SERVER_DIR_EFFECTIVE}"
          bye

          LFTP

      - name: Deploy dist to Hostinger via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          ssl_settings="set ftp:ssl-allow no"
          scheme="ftp"
          if [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps" ]; then
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          elif [ "$FTP_PROTOCOL_EFFECTIVE" = "ftps-legacy" ]; then
            scheme="ftps"
            ssl_settings=$'set ftp:ssl-force true\nset ftp:ssl-protect-data true'
          fi

          lftp <<LFTP
          set cmd:fail-exit yes
          set net:timeout 120
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set ftp:passive-mode yes
          set xfer:clobber yes
          ${ssl_settings}
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT_EFFECTIVE}" "${scheme}://${FTP_HOST}"
          mirror --reverse --verbose=1 --parallel=1 --overwrite --no-perms "dist/" "${FTP_SERVER_DIR_EFFECTIVE}"
          bye
          LFTP

      - name: Verify production deployment
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 "https://divelife.mx/?deploy-check=${GITHUB_SHA}" -o /tmp/divelife-home.html
          test -s /tmp/divelife-home.html || { echo "::error::Production homepage response was empty."; exit 1; }
          curl --fail --location --silent --show-error --max-time 30 "https://divelife.mx/deploy-version.txt?deploy-check=${GITHUB_SHA}" -o /tmp/divelife-deploy-version.txt
          grep -qx "${GITHUB_SHA}" /tmp/divelife-deploy-version.txt || { echo "::error::Production deploy marker does not match this workflow SHA."; exit 1; }
          echo "Production URL responded and deploy marker matches this workflow SHA."
